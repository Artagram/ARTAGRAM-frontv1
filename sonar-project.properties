# Configuración de SonarQube Cloud para el frontend.
# La organización se pasa desde el workflow (variable SONAR_ORGANIZATION).
sonar.projectKey=Artagram_ARTAGRAM-frontv1
sonar.projectName=ARTAGRAM-frontv1
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
