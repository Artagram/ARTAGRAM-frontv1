name: CI/CD - Frontend (build, test y deploy a S3 + CloudFront)

# Este workflow realiza:
# 1. Linting y pruebas unitarias de Frontend (Vitest & Oxlint).
# 2. Build de producción con Vite.
# 3. Sincronizacion del build a S3 e invalidacion de cache en CloudFront.
#
# Reemplaza al pipeline anterior (Docker + nginx desplegado en EC2 via SSH):
# ya no hay ninguna instancia EC2 para el frontend, y una SPA estatica no
# necesita un servidor propio -- S3 + CloudFront la sirve mas simple y mas
# barato.

# En un pull request solo corre el job "Pruebas y Linting" (incluye un build
# de verificación). El deploy ocurre únicamente con el merge a main, que el
# ruleset de la organización solo permite por PR aprobado y con este job en
# verde (ver artagram-infra/README.md, "Flujo de trabajo").

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  S3_BUCKET: artagram-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E2FJFS7QLT0BH6
  # La API y el WebSocket van por el mismo dominio HTTPS del frontend:
  # CloudFront los reenvia al ALB (ver AWS_DEPLOYMENT.md, seccion 11).
  PUBLIC_HOST: dm9jdgs6nc89v.cloudfront.net

jobs:
  test:
    name: Pruebas y Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Linting de código
        run: npm run lint

      - name: Pruebas unitarias (Vitest)
        run: npm run test

      - name: Build de verificación (Vite)
        run: npm run build

  build-and-deploy:
    name: Build y deploy a S3 + CloudFront
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción (Vite)
        env:
          VITE_API_BASE_URL: https://${{ env.PUBLIC_HOST }}
          VITE_WS_URL: wss://${{ env.PUBLIC_HOST }}/ws
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_PAGOS_ACTIVOS: ${{ vars.PAGOS_ACTIVOS }}
        run: npm run build

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sincronizar assets con cache largo (hash en el nombre, inmutables)
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" \
            --include "assets/*"

      - name: Sincronizar el resto (index.html, etc.) sin cache
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}" \
            --delete \
            --cache-control "no-cache" \
            --exclude "assets/*"

      - name: Invalidar cache de CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
